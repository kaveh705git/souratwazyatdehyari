<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صورت وضعیت قرارداد - قابل ویرایش</title>
    <style>
        /* ===== استایل‌های پایه ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
            font-family: 'Vazirmatn', 'Vazir', 'Segoe UI', Tahoma, 'Iranian Sans', sans-serif;
            direction: rtl;
        }

        /* ===== کاغذ A4 ===== */
        .paper {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            padding: 12mm 15mm 15mm 15mm;
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ===== استایل مشترک کادرهای شیشه‌ای ===== */
        .glass-input {
            background: rgba(255, 255, 255, 0.4) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.7) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            transition: all 0.3s ease;
            color: #1a202c;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8) !important;
            border-color: rgba(43, 108, 176, 0.6) !important;
            box-shadow: 0 0 0 4px rgba(43, 108, 176, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            outline: none;
        }

        /* ===== سربرگ ===== */
        .letterhead {
            display: flex;
            flex-direction: column;
            margin-bottom: 4mm;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2mm;
        }

        /* سمت چپ: شماره و تاریخ */
        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 3mm;
            margin-top: 2mm;
            font-size: 11pt;
            font-weight: 600;
            color: #1a202c;
        }

        .meta-info .field-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-info label {
            white-space: nowrap;
        }

        .meta-info input {
            font-family: inherit;
            font-size: 11pt;
            color: #1a202c;
            width: 130px;
            text-align: right;
            padding: 2px 4px;
            border: none !important;
            border-bottom: 1.5px dashed #718096 !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .meta-info input:focus {
            border-bottom: 2px solid #2b6cb0 !important;
            background: #ebf4ff !important;
            border-radius: 6px !important;
        }

        /* سمت راست: لوگو و نام روستا */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80mm;
        }

        .logo-svg {
            width: 75px;
            height: 75px;
            margin-bottom: 6px;
            object-fit: contain;
        }

        .village-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11pt;
            font-weight: 700;
        }

        .village-input-wrapper span {
            color: #1e3a5f;
        }

        .village-input-wrapper input {
            font-family: inherit;
            font-size: 11pt;
            color: #d32f2f;
            font-weight: 700;
            width: 100px;
            text-align: center;
            padding: 3px 6px;
            border: none !important;
            border-bottom: 1.5px dashed #718096 !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .village-input-wrapper input:focus {
            border-bottom: 2px solid #2b6cb0 !important;
            background: #ebf4ff !important;
            border-radius: 6px !important;
        }

        /* عنوان مرکزی */
        .main-title {
            text-align: center;
            font-size: 14pt;
            font-weight: 700;
            color: #000000;
            margin-top: 6mm;
            margin-bottom: 3mm;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .main-title input {
            font-family: inherit;
            font-size: 14pt;
            font-weight: 700;
            color: #d32f2f;
            text-align: center;
            width: 250px;
            padding: 4px 10px;
            border-bottom: 2px dashed rgba(211, 47, 47, 0.5) !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .main-title input:focus {
            border-bottom: 2px solid #d32f2f !important;
            background: rgba(255, 255, 255, 0.5) !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
        }

        /* خط زیر سربرگ */
        .header-divider {
            border-bottom: 2px solid #1a202c;
            margin-bottom: 6mm;
        }

        /* ===== جدول ===== */
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 6mm;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10pt;
            table-layout: fixed;
            border: 1.5px solid #1e3a5f;
        }

        thead th {
            background: #1e3a5f;
            color: #ffffff;
            font-weight: 700;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #2d4a6f;
            font-size: 9.5pt;
            white-space: nowrap;
            vertical-align: middle;
        }

        tbody td {
            border: 1px solid #a0aec0;
            padding: 4px;
            vertical-align: middle;
            text-align: center;
            background: #ffffff;
        }

        th:nth-child(1), td:nth-child(1) { width: 6%; }
        th:nth-child(2), td:nth-child(2) { width: 44%; }
        th:nth-child(3), td:nth-child(3) { width: 15%; }
        th:nth-child(4), td:nth-child(4) { width: 20%; }
        th:nth-child(5), td:nth-child(5) { width: 15%; }

        td input {
            width: 100%;
            font-family: inherit;
            font-size: 10pt;
            text-align: center;
            padding: 6px 4px;
            color: #1a202c;
            min-width: 0;
        }

        td input::placeholder {
            color: #a0aec0;
            font-size: 8.5pt;
            opacity: 0.8;
        }

        td input[readonly] {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: 600;
            cursor: default;
        }

        /* ===== جمع کل ===== */
        .total-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: stretch;
            gap: 10px 30px;
            margin-bottom: 8mm;
        }

        .total-section .field-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 250px;
        }

        .total-section label {
            font-weight: 700;
            font-size: 11pt;
            color: #1e3a5f;
            white-space: nowrap;
        }

        .total-section input {
            flex: 1;
            font-family: inherit;
            font-size: 11pt;
            padding: 8px 12px;
            font-weight: 600;
            color: #1a202c;
            min-width: 120px;
        }

        /* کادر متن حروفی مبلغ قابل پرداخت */
        .total-section .payable-group {
            flex: 1 1 100%;
        }

        .total-section .payable-group input {
            background: rgba(235, 244, 255, 0.6) !important;
            color: #1e3a5f;
            font-weight: 700;
            font-size: 11pt;
            text-align: right;
            direction: rtl;
            padding: 10px 15px;
            border-color: rgba(43, 108, 176, 0.3) !important;
        }

        /* ===== امضا ===== */
        .signature-area {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            padding-top: 10mm;
        }

        .signature-box {
            text-align: center;
            min-width: 75mm;
            border-top: 2px dashed #a0aec0;
            padding-top: 4mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .signature-box label {
            font-weight: 700;
            font-size: 11pt;
            color: #2d3748;
            white-space: nowrap;
        }

        .signature-box input {
            font-family: inherit;
            font-size: 11pt;
            text-align: center;
            padding: 8px 12px;
            width: 100%;
        }

        /* ===== دکمه چاپ ===== */
        .print-btn-wrapper {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 100;
        }

        .print-btn {
            background: #1e3a5f;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-family: inherit;
            font-size: 13pt;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .print-btn:hover {
            background: #2b4a72;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(30, 58, 95, 0.5);
        }

        /* ===== استایل چاپ ===== */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0;
                margin: 0;
                display: block;
            }

            .paper {
                width: 100%;
                min-height: auto;
                box-shadow: none;
                border-radius: 0;
                padding: 10mm 12mm;
                margin: 0;
            }

            .print-btn-wrapper {
                display: none !important;
            }

            input {
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                color: #000000 !important;
                font-weight: 500 !important;
            }

            .main-title input, .meta-info input, .village-input-wrapper input {
                border-bottom: 1px dashed #555 !important;
            }

            input::placeholder {
                color: transparent !important;
            }

            thead th {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .signature-box {
                border-top: 2px dashed #555 !important;
            }

            .header-divider {
                border-bottom: 2px solid #1a202c !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .total-section .payable-group input {
                background: transparent !important;
            }
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 700px) {
            .paper {
                padding: 12mm 8mm;
                width: 100%;
                min-height: auto;
            }

            .top-header {
                flex-direction: column-reverse;
                align-items: center;
                gap: 15px;
            }

            .meta-info {
                align-items: center;
                width: 100%;
                margin-top: 0;
            }

            .meta-info .field-group {
                width: 100%;
                justify-content: center;
            }

            .main-title {
                font-size: 12pt;
                flex-direction: column;
                gap: 4px;
            }

            .main-title input {
                width: 200px;
            }

            table {
                font-size: 8pt;
            }

            td input {
                font-size: 8pt;
                padding: 4px 1px;
            }

            .total-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- ===== دکمه چاپ ===== -->
    <div class="print-btn-wrapper">
        <button class="print-btn" onclick="window.print()" title="چاپ صورت وضعیت">
            🖨️ چاپ صورت وضعیت
        </button>
    </div>

    <!-- ===== کاغذ اصلی ===== -->
    <div class="paper">

        <!-- ===== سربرگ ===== -->
        <div class="letterhead">
            
            <div class="top-header">
                <!-- سمت راست: لوگو و نام روستا -->
                <div class="logo-section">
                    <img src="logo.png" alt="آرم دهیاری" class="logo-svg">
                    
                    <div class="village-input-wrapper">
                        <span>دهیاری</span>
                        <input type="text" id="villageName" class="glass-input" placeholder="نام روستا" value="">
                    </div>
                </div>

                <!-- سمت چپ: شماره و تاریخ -->
                <div class="meta-info">
                    <div class="field-group">
                        <label for="metaNumber">شماره :</label>
                        <input type="text" id="metaNumber" class="glass-input" placeholder="---" value="">
                    </div>
                    <div class="field-group">
                        <label for="dateField">تاریخ :</label>
                        <input type="text" id="dateField" class="glass-input" placeholder="---" value="">
                    </div>
                </div>
            </div>

            <!-- عنوان مرکزی -->
            <div class="main-title">
                <span>صورت وضعیت قرارداد شماره :</span>
                <input type="text" id="contractNumber" class="glass-input" placeholder="اینجا باید شماره قرارداد درج شود" value="">
            </div>

            <!-- خط جداکننده -->
            <div class="header-divider"></div>
        </div>

        <!-- ===== جدول ===== -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>شرح عملیات</th>
                        <th>تعداد</th>
                        <th>مبلغ واحد (ریال)</th>
                        <th>مبلغ کل (ریال)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- ردیف‌ها توسط JS ساخته می‌شوند -->
                </tbody>
            </table>
        </div>

        <!-- ===== جمع کل و مبلغ قابل پرداخت (حروفی) ===== -->
        <div class="total-section">
            <div class="field-group">
                <label for="sumTotal">جمع کل :</label>
                <input type="text" id="sumTotal" class="glass-input" placeholder="جمع کل (ریال)" value="" readonly>
            </div>
            
            <div class="field-group payable-group">
                <label for="payable">مبلغ قابل پرداخت :</label>
                <input type="text" id="payable" class="glass-input" placeholder="مبلغ به حروف..." value="" readonly>
            </div>
        </div>

        <!-- ===== امضا ===== -->
        <div class="signature-area">
            <div class="signature-box">
                <label for="approverName">امضای تأییدکننده :</label>
                <input type="text" id="approverName" class="glass-input" placeholder="نام و امضا" value="">
            </div>
        </div>

    </div>

    <!-- ===== جاوااسکریپت ===== -->
    <script>
        (function() {
            'use strict';

            const tableBody = document.getElementById('tableBody');
            const ROW_COUNT = 7;

            const defaultDescriptions = [
                'عملیات خاکی و آماده‌سازی',
                'اجرای فونداسیون',
                'اسکلت‌بندی',
                'دیوارچینی و سفت‌کاری',
                '',
                '',
                ''
            ];

            // ============================================================
            // 1. توابع تبدیل اعداد
            // ============================================================
            function toPersianDigits(str) {
                if (str === null || str === undefined) return '';
                const persian = '۰۱۲۳۴۵۶۷۸۹';
                const latin = '0123456789';
                let result = str.toString();
                for (let i = 0; i < 10; i++) {
                    result = result.replace(new RegExp(latin[i], 'g'), persian[i]);
                }
                return result;
            }

            function toLatinDigits(str) {
                if (!str) return '';
                const persian = '۰۱۲۳۴۵۶۷۸۹';
                const arabic = '٠١٢٣٤٥٦٧٨٩';
                let result = str;
                for (let i = 0; i < 10; i++) {
                    result = result.replace(new RegExp(persian[i], 'g'), i);
                    result = result.replace(new RegExp(arabic[i], 'g'), i);
                }
                return result;
            }

            function extractFirstNumber(str) {
                if (!str) return 0;
                const latinStr = toLatinDigits(str);
                const match = latinStr.match(/[0-9]+(\.[0-9]+)?/);
                return match ? parseFloat(match[0]) : 0;
            }

            function cleanNumberString(str) {
                if (!str) return '';
                let s = toLatinDigits(str);
                s = s.replace(/[^0-9.]/g, '');
                const parts = s.split('.');
                if (parts.length > 2) {
                    s = parts[0] + '.' + parts.slice(1).join('');
                }
                return s;
            }

            function parseNumber(str) {
                const cleaned = cleanNumberString(str);
                if (cleaned === '' || cleaned === '.') return 0;
                const num = parseFloat(cleaned);
                return isNaN(num) ? 0 : num;
            }

            function formatNumber(num) {
                if (num === 0 || isNaN(num)) return '۰';
                const rounded = Math.round(num * 100) / 100;
                const parts = rounded.toString().split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                let result = parts.join('.');
                return toPersianDigits(result);
            }

            // ============================================================
            // 2. تابع تبدیل عدد به حروف فارسی
            // ============================================================
            function numberToPersianWords(num) {
                if (num === 0) return 'صفر';
                if (isNaN(num) || num === null) return '';

                // بخش صحیح عدد را جدا می‌کنیم (تا ۱۵ رقم پشتیبانی می‌شود)
                num = Math.floor(num);
                if (num === 0) return 'صفر';

                const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
                const dahgan = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
                const dahyek = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
                const sadgan = ['', 'یکصد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
                const scales = ['', 'هزار', 'میلیون', 'میلیارد', 'بیلیون'];

                // تابع داخلی برای تبدیل سه رقم
                function threeDigitsToWords(n) {
                    let parts = [];
                    const sad = Math.floor(n / 100);
                    const remainder = n % 100;
                    
                    if (sad > 0) parts.push(sadgan[sad]);
                    
                    if (remainder >= 10 && remainder < 20) {
                        parts.push(dahyek[remainder - 10]);
                    } else {
                        const dah = Math.floor(remainder / 10);
                        const yek = remainder % 10;
                        if (dah > 0) parts.push(dahgan[dah]);
                        if (yek > 0) parts.push(yekan[yek]);
                    }
                    
                    return parts.join(' و ');
                }

                // تقسیم عدد به بخش‌های سه رقمی
                let numStr = num.toString();
                let parts = [];
                let scaleIndex = 0;
                
                while (numStr.length > 0) {
                    const chunk = numStr.slice(-3);
                    numStr = numStr.slice(0, -3);
                    const chunkNum = parseInt(chunk, 10);
                    
                    if (chunkNum > 0) {
                        let word = threeDigitsToWords(chunkNum);
                        if (scales[scaleIndex]) {
                            word += ' ' + scales[scaleIndex];
                        }
                        parts.unshift(word);
                    }
                    scaleIndex++;
                }
                
                return parts.join(' و ');
            }

            // ============================================================
            // 3. ساخت ردیف‌های جدول
            // ============================================================
            for (let i = 0; i < ROW_COUNT; i++) {
                const tr = document.createElement('tr');

                // ستون ۱: ردیف
                const tdRow = document.createElement('td');
                const rowInput = document.createElement('input');
                rowInput.type = 'text';
                rowInput.value = toPersianDigits(i + 1);
                rowInput.readOnly = true;
                rowInput.style.backgroundColor = 'transparent';
                rowInput.style.fontWeight = '600';
                rowInput.style.cursor = 'default';
                rowInput.style.border = 'none';
                rowInput.style.boxShadow = 'none';
                tdRow.appendChild(rowInput);
                tr.appendChild(tdRow);

                // ستون ۲: شرح عملیات
                const tdDesc = document.createElement('td');
                const descInput = document.createElement('input');
                descInput.type = 'text';
                descInput.placeholder = 'شرح عملیات...';
                descInput.value = defaultDescriptions[i] || '';
                descInput.className = 'glass-input';
                descInput.setAttribute('data-field', 'desc');
                descInput.setAttribute('data-row', i + 1);
                tdDesc.appendChild(descInput);
                tr.appendChild(tdDesc);

                // ستون ۳: تعداد
                const tdQty = document.createElement('td');
                const qtyInput = document.createElement('input');
                qtyInput.type = 'text';
                qtyInput.placeholder = 'تعداد/مقدار';
                qtyInput.className = 'glass-input';
                qtyInput.setAttribute('data-field', 'qty');
                qtyInput.setAttribute('data-row', i + 1);
                tdQty.appendChild(qtyInput);
                tr.appendChild(tdQty);

                // ستون ۴: مبلغ واحد
                const tdUnit = document.createElement('td');
                const unitInput = document.createElement('input');
                unitInput.type = 'text';
                unitInput.placeholder = 'مبلغ واحد';
                unitInput.className = 'glass-input';
                unitInput.setAttribute('data-field', 'unit');
                unitInput.setAttribute('data-row', i + 1);
                unitInput.setAttribute('inputmode', 'numeric');
                tdUnit.appendChild(unitInput);
                tr.appendChild(tdUnit);

                // ستون ۵: مبلغ کل
                const tdTotal = document.createElement('td');
                const totalInput = document.createElement('input');
                totalInput.type = 'text';
                totalInput.placeholder = 'مبلغ کل';
                totalInput.className = 'glass-input';
                totalInput.setAttribute('data-field', 'total');
                totalInput.setAttribute('data-row', i + 1);
                totalInput.setAttribute('readonly', 'readonly');
                totalInput.style.backgroundColor = 'rgba(237, 242, 247, 0.6)';
                tdTotal.appendChild(totalInput);
                tr.appendChild(tdTotal);

                tableBody.appendChild(tr);
            }

            // ============================================================
            // 4. محاسبات
            // ============================================================
            function calculateRowTotal(rowIndex) {
                const qtyInput = document.querySelector(`input[data-field="qty"][data-row="${rowIndex}"]`);
                const unitInput = document.querySelector(`input[data-field="unit"][data-row="${rowIndex}"]`);
                const totalInput = document.querySelector(`input[data-field="total"][data-row="${rowIndex}"]`);

                if (!qtyInput || !unitInput || !totalInput) return 0;

                const qty = extractFirstNumber(qtyInput.value);
                const unit = parseNumber(unitInput.value);
                const total = qty * unit;

                if (total === 0) {
                    totalInput.value = '';
                    totalInput.placeholder = 'مبلغ کل';
                } else {
                    totalInput.value = formatNumber(total);
                }

                return total;
            }

            function calculateGrandTotal() {
                let sum = 0;
                for (let i = 1; i <= ROW_COUNT; i++) {
                    const totalInput = document.querySelector(`input[data-field="total"][data-row="${i}"]`);
                    if (totalInput && totalInput.value) {
                        const val = parseNumber(totalInput.value);
                        if (!isNaN(val)) sum += val;
                    }
                }
                const sumInput = document.getElementById('sumTotal');
                if (sum === 0) {
                    sumInput.value = '';
                    sumInput.placeholder = 'جمع کل (ریال)';
                } else {
                    sumInput.value = formatNumber(sum);
                }

                // به‌روزرسانی مبلغ قابل پرداخت با حروف
                updatePayableText(sum);

                return sum;
            }

            // ============================================================
            // 5. به‌روزرسانی مبلغ قابل پرداخت (حروفی)
            // ============================================================
            function updatePayableText(amount) {
                const payableInput = document.getElementById('payable');
                if (!payableInput) return;

                if (amount === 0) {
                    payableInput.value = '';
                    payableInput.placeholder = 'مبلغ به حروف...';
                    return;
                }

                let words = numberToPersianWords(amount);
                payableInput.value = words + ' ریال';
            }

            // ============================================================
            // 6. رویدادها
            // ============================================================
            function handleInputChange(e) {
                const target = e.target;
                if (!target.matches('input')) return;
                const field = target.getAttribute('data-field');
                const row = target.getAttribute('data-row');

                if (field === 'qty' || field === 'unit') {
                    let val = target.value;
                    // تبدیل زنده اعداد انگلیسی به فارسی
                    target.value = toPersianDigits(val);
                    
                    calculateRowTotal(parseInt(row));
                    calculateGrandTotal();
                }
            }

            tableBody.addEventListener('input', handleInputChange);

            // مقداردهی اولیه
            for (let i = 1; i <= ROW_COUNT; i++) {
                calculateRowTotal(i);
            }
            calculateGrandTotal();

            function formatOnBlur(e) {
                const target = e.target;
                if (!target.matches('input')) return;
                const field = target.getAttribute('data-field');

                if (field === 'unit') {
                    const raw = target.value;
                    if (!raw || raw.trim() === '') return;
                    const num = parseNumber(raw);
                    if (num !== 0) {
                        target.value = formatNumber(num);
                    } else {
                        const cleaned = cleanNumberString(raw);
                        if (cleaned === '0' || cleaned === '0.0') {
                            target.value = toPersianDigits('0');
                        } else {
                            target.value = '';
                        }
                    }
                    const row = target.getAttribute('data-row');
                    calculateRowTotal(parseInt(row));
                    calculateGrandTotal();
                }
            }

            tableBody.addEventListener('blur', formatOnBlur, true);

            window.addEventListener('beforeprint', function() {
                for (let i = 1; i <= ROW_COUNT; i++) {
                    calculateRowTotal(i);
                }
                calculateGrandTotal();
            });

        })();
    </script>
</body>
</html>
