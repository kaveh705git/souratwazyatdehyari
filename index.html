ant;background:#ebf4ff!important;border-radius:6px!important}.date-group{display:flex;align-items:center;gap:4px;direction:rtl}.date-group select{font-family:inherit;font-size:10pt;font-weight:600;color:#1a202c;height:32px;border:1px solid #cbd5e0;border-radius:6px;background-color:#fff;outline:0;transition:border-color .2s,box-shadow .2s;text-align:center;text-align-last:center;cursor:pointer;-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5568' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:left 4px center;background-size:12px;padding-left:18px;padding-right:2px}.date-group select#daySelect{width:55px}.date-group select#monthSelect{width:80px}.date-group select#yearSelect{width:65px}.date-group select:focus{border-color:#2b6cb0;box-shadow:0 0 0 3px rgba(43,108,176,.15)}.date-group .sep{font-weight:700;font-size:12pt;color:#718096;margin:0 1px}.logo-section{display:flex;flex-direction:column;align-items:center;min-width:80mm}.logo-svg{width:75px;height:75px;margin-bottom:6px;object-fit:contain}.village-input-wrapper{display:flex;align-items:center;gap:5px;font-size:11pt;font-weight:700}.village-input-wrapper span{color:#1e3a5f}.village-input-wrapper input{font-family:inherit;font-size:11pt;color:#d32f2f;font-weight:700;width:100px;text-align:center;padding:3px 6px;border:none!important;border-bottom:1.5px dashed #718096!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}.village-input-wrapper input:focus{border-bottom:2px solid #2b6cb0!important;background:#ebf4ff!important;border-radius:6px!important}.main-title{text-align:center;font-size:14pt;font-weight:700;color:#000;margin-top:6mm;margin-bottom:3mm;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.main-title input{font-family:inherit;font-size:14pt;font-weight:700;color:#d32f2f;text-align:center;width:250px;padding:4px 10px;border-bottom:2px dashed rgba(211,47,47,.5)!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}.main-title input:focus{border-bottom:2px solid #d32f2f!important;background:rgba(255,255,255,.5)!important;border-radius:8px!important;box-shadow:0 4px 15px rgba(0,0,0,.05)!important}.header-divider{border-bottom:2px solid #1a202c;margin-bottom:6mm}.table-wrapper{overflow-x:auto;margin-bottom:6mm}table{width:100%;border-collapse:collapse;font-family:'Vazirmatn','Vazir',sans-serif;font-size:10pt;table-layout:fixed;border:1.5px solid #1e3a5f}thead th{background:#1e3a5f;color:#fff;font-weight:700;padding:8px 4px;text-align:center;border:1px solid #2d4a6f;font-size:10pt;white-space:nowrap;vertical-align:middle}tbody td{border:1px solid #a0aec0;padding:4px;vertical-align:middle;text-align:center;background:#fff}th:nth-child(1),td:nth-child(1){width:6%}th:nth-child(2),td:nth-child(2){width:44%}th:nth-child(3),td:nth-child(3){width:15%}th:nth-child(4),td:nth-child(4){width:20%}th:nth-child(5),td:nth-child(5){width:15%}td input{width:100%;font-family:'Vazirmatn','Vazir',sans-serif;font-size:12pt;font-weight:500;text-align:center;padding:6px 4px;color:#1a202c;min-width:0}td input::placeholder{color:#a0aec0;font-size:10pt;opacity:.8}td input[readonly]{background:transparent!important;border:none!important;box-shadow:none!important;font-weight:700;cursor:default}.total-section{display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:stretch;gap:10px 30px;margin-bottom:8mm}.total-section .field-group{display:flex;align-items:center;gap:10px;flex:1 1 250px}.total-section label{font-weight:700;font-size:11pt;color:#1e3a5f;white-space:nowrap}.total-section input{flex:1;font-family:inherit;font-size:12pt;padding:8px 12px;font-weight:600;color:#1a202c;min-width:120p ex)=>{let option=document.createElement('option');option.value=name;option.text=name;monthSelect.appendChild(option)});for(let i=1405;i<=1415;i++){let option=document.createElement('option');option.value=_pDigits(i.toString());option.text=_pDigits(i.toString());yearSelect.appendChild(option)}function extractFirstNumber(str){if(!str)return 0;const latinStr=_lDigits(str);const match=latinStr.match(/[0-9]+(\.[0-9]+)?/);return match?parseFloat(match[0]):0}function cleanNumberString(str){if(!str)return'';let s=_lDigits(str);s=s.replace(/[^0-9.]/g,'');const parts=s.split('.');if(parts.length>2){s=parts[0]+'.'+parts.slice(1).join('')}return s}function parseNumber(str){const cleaned=cleanNumberString(str);if(cleaned===''||cleaned==='.')return 0;const num=parseFloat(cleaned);return isNaN(num)?0:num}function formatNumber(num){if(num===0||isNaN(num))return'۰';const rounded=Math.round(num*100)/100;const parts=rounded.toString().split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');let result=parts.join('.');return _pDigits(result)}function numberToPersianWords(num){if(num===0)return'صفر';if(isNaN(num)||num===null)return'';num=Math.floor(num);if(num===0)return'صفر';const yekan=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];const dahgan=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];const dahyek=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];const sadgan=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];const scales=['','هزار','میلیون','میلیارد','بیلیون'];function threeDigitsToWords(n){let parts=[];const sad=Math.floor(n/100);const remainder=n%100;if(sad>0)parts.push(sadgan[sad]);if(remainder>=10&&remainder<20){parts.push(dahyek[remainder-10])}else{const dah=Math.floor(remainder/10);const yek=remainder%10;if(dah>0)parts.push(dahgan[dah]);if(yek>0)parts.push(yekan[yek])}return parts.join(' و ')}let numStr=num.toString();let parts=[];let scaleIndex=0;while(numStr.length>0){const chunk=numStr.slice(-3);numStr=numStr.slice(0,-3);const chunkNum=parseInt(chunk,10);if(chunkNum>0){let word=threeDigitsToWords(chunkNum);if(scales[scaleIndex]){word+=' '+scales[scaleIndex]}parts.unshift(word)}scaleIndex++}return parts.join(' و ')}const tableBody=document.getElementById('tableBody');const ROW_COUNT=7;for(let i=0;i<ROW_COUNT;i++){const tr=document.createElement('tr');const tdRow=document.createElement('td');const rowInput=document.createElement('input');rowInput.type='text';rowInput.value=_pDigits(i+1);rowInput.readOnly=true;rowInput.style.backgroundColor='transparent';rowInput.style.fontWeight='600';rowInput.style.cursor='default';rowInput.style.border='none';rowInput.style.boxShadow='none';tdRow.appendChild(rowInput);tr.appendChild(tdRow);const tdDesc=document.createElement('td');const descInput=document.createElement('input');descInput.type='text';descInput.placeholder='شرح عملیات...';descInput.className='glass-input';descInput.setAttribute('data-field','desc');descInput.setAttribute('data-row',i+1);tdDesc.appendChild(descInput);tr.appendChild(tdDesc);const tdQty=document.createElement('td');const qtyInput=document.createElement('input');qtyInput.type='text';qtyInput.placeholder='تعداد/مقدار';qtyInput.className='glass-input';qtyInput.setAttribute('data-field','qty');qtyInput.setAttribute('data-row',i+1);tdQty.appendChild(qtyInput);tr.appendChild(tdQty);const tdUnit=document.createElement('td');const unitInput=document.createElement('input');unitInput.type='text';unitInput.placeholder='مبلغ واحد';unitInput.className='glass-input';unitInput.setAttribute('data-field','unit');unitInput.setAttribute('data-row',i+1);unitInput.setAttribute('inputmode','numeric');tdUnit.appendChild(unitInput);tr.appendChild(tdUnit);const tdTotal=document.createElement('td');const totalInput=document.createElement('input');totalInput.type='text';totalInput.placeholder='مبلغ کل';totalInput.className='glass-input';totalInput.setAttribute('data-field','total');totalInput.setAttribute('data-row',i+1);totalInput.setAttribute('readonly','readonly');totalInput.style.backgroundColor='rgba(237, 242, 247, 0.6)';tdTotal.appendChild(totalInput);tr.appendChild(tdTotal);tableBody.appendChild(tr)}function calculateRowTotal(rowIndex){const qtyInput=document.querySelector(`input[data-field="qty"][data-row="${rowIndex}"]`);const unitInput=document.querySelector(`input[data-field="unit"][data-row="${rowIndex}"]`);const totalInput=document.querySelector(`input[data-field="total"][data-row="${rowIndex}"]`);if(!qtyInput||!unitInput||!totalInput)return 0;const qty=extractFirstNumber(qtyInput.value);const unit=parseNumber(unitInput.value);const total=qty*unit;if(total===0){totalInput.value='';totalInput.placeholder='مبلغ کل'}else{totalInput.value=formatNumber(total)}return total}function calculateGrandTotal(){let sum=0;for(let i=1;i<=ROW_COUNT;i++){const totalInput=document.querySelector(`input[data-field="total"][data-row="${i}"]`);if(totalInput&&totalInput.value){const val=parseNumber(totalInput.value);if(!isNaN(val))sum+=val}}const sumInput=document.getElementById('sumTotal');if(sum===0){sumInput.value='';sumInput.placeholder='جمع کل (ریال)'}else{sumInput.value=formatNumber(sum)}updatePayableText(sum);return sum}function updatePayableText(amount){const payableInput=document.getElementById('payable');if(!payableInput)return;if(amount===0){payableInput.value='';payableInput.placeholder='مبلغ به حروف...';return}let words=numberToPersianWords(amount);payableInput.value=words+' ریال'}function handleInputChange(e){const target=e.target;if(!target.matches('input'))return;const field=target.getAttribute('data-field');const row=target.getAttribute('data-row');if(field==='qty'||field==='unit'){let val=target.value;target.value=_pDigits(val);calculateRowTotal(parseInt(row));calculateGrandTotal()}}tableBody.addEventListener('input',handleInputChange);for(let i=1;i<=ROW_COUNT;i++){calculateRowTotal(i)}calculateGrandTotal();function formatOnBlur(e){const target=e.target;if(!target.matches('input'))return;const field=target.getAttribute('data-field');if(field==='unit'){const raw=target.value;if(!raw||raw.trim()==='')return;const num=parseNumber(raw);if(num!==0){target.value=formatNumber(num)}else{const cleaned=cleanNumberString(raw);if(cleaned==='0'||cleaned==='0.0'){target.value=_pDigits('0')}else{target.value=''}}const row=target.getAttribute('data-row');calculateRowTotal(parseInt(row));calculateGrandTotal()}}tableBody.addEventListener('blur',formatOnBlur,true);window.addEventListener('beforeprint',function(){for(let i=1;i<=ROW_COUNT;i++){calculateRowTotal(i)}calculateGrandTotal()})})();</script></body></html>
